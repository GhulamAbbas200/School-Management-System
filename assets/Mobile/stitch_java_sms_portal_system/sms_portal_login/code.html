<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .mode-transition {
            transition: all 0.4s ease-in-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center">
<!-- Top Branding Section -->
<header class="w-full max-w-md px-gutter pt-12 pb-8 flex flex-col items-center text-center">
<div class="mb-6 relative">
<div class="w-20 h-20 bg-primary rounded-xl flex items-center justify-center shadow-lg transform rotate-3">
<span class="material-symbols-outlined text-on-primary text-5xl" data-icon="school">school</span>
</div>
<div class="absolute -bottom-2 -right-2 w-10 h-10 bg-secondary rounded-lg flex items-center justify-center shadow-md transform -rotate-6">
<span class="material-symbols-outlined text-on-secondary text-2xl" data-icon="auto_stories">auto_stories</span>
</div>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">EduCore SMS</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs">
            The intelligent hub for academic excellence. Manage your educational journey with ease and precision.
        </p>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md px-gutter pb-16 flex-grow flex flex-col justify-center">
<!-- Login Card -->
<section class="login-card bg-surface-container-lowest border border-outline-variant p-8 rounded-xl shadow-sm" id="login-container">
<div class="mb-8">
<h2 class="font-headline-md text-headline-md text-on-surface mb-1" id="form-title">Student Sign In</h2>
<p class="font-body-md text-body-md text-on-surface-variant" id="form-subtitle">Access your portal using your institutional credentials.</p>
</div>
<form class="space-y-6" id="auth-form">
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface block uppercase tracking-wider" for="identity" id="identity-label">Roll Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="badge">badge</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none font-body-md" id="identity" name="identity" placeholder="Enter your roll number" required="" type="text"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface block uppercase tracking-wider" for="password">Password</label>
<a class="text-primary font-label-md hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none font-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="flex items-center gap-3">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary" id="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant" for="remember">Keep me signed in</label>
</div>
<button class="w-full bg-primary text-on-primary py-4 rounded-lg font-headline-sm shadow-md hover:bg-primary-container transition-colors flex items-center justify-center gap-2 group" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
</section>
<!-- Mode Toggle Section -->
<div class="mt-8 text-center">
<button class="group inline-flex items-center gap-2 px-6 py-2 rounded-full border border-outline-variant bg-white shadow-sm hover:bg-surface-container-low transition-all" id="mode-toggle">
<span class="material-symbols-outlined text-primary" data-icon="admin_panel_settings" id="toggle-icon">admin_panel_settings</span>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-primary transition-colors" id="toggle-text">Switch to Admin Sign In</span>
</button>
</div>
</main>
<!-- Visual Decoration (Bottom) -->
<div class="hidden md:block fixed bottom-0 left-0 w-full overflow-hidden pointer-events-none -z-10 h-64">
<div class="absolute -bottom-24 -left-24 w-96 h-96 rounded-full bg-primary/5 blur-3xl"></div>
<div class="absolute -bottom-24 -right-24 w-96 h-96 rounded-full bg-secondary/5 blur-3xl"></div>
</div>
<!-- Background Image Strategy -->
<div class="hidden">
<img data-alt="A clean and modern educational environment featuring a spacious university library corridor with soft natural light streaming through large windows. The scene is characterized by minimalist architecture, high-density wood grain textures, and a professional workspace atmosphere in a bright light-mode aesthetic. The color palette is dominated by calm whites, slate grays, and deep academic blues, creating a mood of focused learning and institutional stability." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAmFy6tTlNE13M_kWd8SMwKr1RPJ0BbelulTLnZbPftQSLO-lgIGjpHtdXpXkvN68Jh1hkik1HlwQ26wft-8uKTznvsZowD8TFVWm8_oygybgS_jT_K0Gd06_XUZ2vlyIFSlpIMYsv9eLsnK2OpzB_V3re-NtSnSOLYWw57M6_4uzHapP2xllliC16H1QzZUR0kMWYOkBvZfXPRI71ZXTAudvOZUFt-Bw89iwGlLjqjzazFlZpQO8CQngw3Udy2tLNeXZDP4gddBg4"/>
</div>
<script>
        const modeToggle = document.getElementById('mode-toggle');
        const formTitle = document.getElementById('form-title');
        const formSubtitle = document.getElementById('form-subtitle');
        const identityLabel = document.getElementById('identity-label');
        const identityInput = document.getElementById('identity');
        const toggleIcon = document.getElementById('toggle-icon');
        const toggleText = document.getElementById('toggle-text');
        const loginContainer = document.getElementById('login-container');

        let isStudentMode = true;

        modeToggle.addEventListener('click', () => {
            isStudentMode = !isStudentMode;

            // Trigger animation
            loginContainer.style.transform = 'translateY(10px)';
            loginContainer.style.opacity = '0.7';

            setTimeout(() => {
                if (isStudentMode) {
                    formTitle.textContent = 'Student Sign In';
                    formSubtitle.textContent = 'Access your portal using your institutional credentials.';
                    identityLabel.textContent = 'Roll Number';
                    identityInput.placeholder = 'Enter your roll number';
                    toggleIcon.textContent = 'admin_panel_settings';
                    toggleText.textContent = 'Switch to Admin Sign In';
                    identityInput.value = '';
                } else {
                    formTitle.textContent = 'Admin Sign In';
                    formSubtitle.textContent = 'System administrator access for campus management.';
                    identityLabel.textContent = 'Username';
                    identityInput.placeholder = 'Enter admin username';
                    toggleIcon.textContent = 'person';
                    toggleText.textContent = 'Switch to Student Sign In';
                    identityInput.value = '';
                }
                
                loginContainer.style.transform = 'translateY(0)';
                loginContainer.style.opacity = '1';
            }, 200);
        });

        // Simple form handling
        document.getElementById('auth-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin material-symbols-outlined" data-icon="sync">sync</span> Authenticating...`;
            
            setTimeout(() => {
                alert('Authentication successful! Redirecting to ' + (isStudentMode ? 'Student Dashboard...' : 'Admin Console...'));
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 1500);
        });
    </script>
</body></html>
